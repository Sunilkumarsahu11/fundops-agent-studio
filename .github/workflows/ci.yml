name: CI

on:
  push:
    branches: [main, integration/cherry-fundops-api]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fundops
          POSTGRES_USER: fundops
          POSTGRES_PASSWORD: fundops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundops -d fundops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://fundops:fundops@localhost:5432/fundops
      APP_ENV: test
      LLM_MODEL: ""
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
      - name: Build backend image
        run: docker build --tag fundops-agent-studio:test .
