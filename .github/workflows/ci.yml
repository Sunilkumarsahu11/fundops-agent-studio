name: CI

on:
  push:
    branches: [main, integration/cherry-fundops-api]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cherrybank
          MYSQL_USER: fundops
          MYSQL_PASSWORD: fundops
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ufundops -pfundops --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 15s
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://fundops:fundops@127.0.0.1:3306/cherrybank?charset=utf8mb4
      APP_ENV: test
      LLM_MODEL: ""
      LLM_API_KEY: ""
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q app
      - name: Build backend image
        run: docker build --tag fundops-agent-studio:test .
