services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundops
      POSTGRES_USER: fundops
      POSTGRES_PASSWORD: fundops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundops -d fundops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://fundops:fundops@postgres:5432/fundops
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_INPUT_CHARS: ${LLM_MAX_INPUT_CHARS:-12000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      LLM_MAX_PLAN_STEPS: ${LLM_MAX_PLAN_STEPS:-6}
      LLM_MAX_PLAN_TOOLS: ${LLM_MAX_PLAN_TOOLS:-6}
      LLM_MAX_RESULT_CHARS: ${LLM_MAX_RESULT_CHARS:-12000}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
