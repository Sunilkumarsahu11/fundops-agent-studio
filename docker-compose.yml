services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundops
      POSTGRES_USER: fundops
      POSTGRES_PASSWORD: fundops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundops -d fundops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://fundops:fundops@postgres:5432/fundops
    ports:
      - "8000:8000"
    command: sh -c "pip install -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
